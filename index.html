<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. A list of lifts, each opening into a page that puts logging first, then best set, trend and history. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --inset:#E4E9EF; --ink:#12171E; --ink-2:#4A5563; --ink-3:#5E6978;
  --line:#D4DAE2; --accent:#1D5FD1; --accent-ink:#FFFFFF; --accent-soft:#DAE6FA;
  --gold:#8A6400; --gold-soft:#F7EAC0; --good:#13703F; --danger:#B3261E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#161B22; --inset:#1E2530; --ink:#E8ECF1; --ink-2:#A2ADBB; --ink-3:#7C8795;
    --line:#2A323E; --accent:#6EA6FF; --accent-ink:#0A1322; --accent-soft:#1A2A45;
    --gold:#E6BC4C; --gold-soft:#3A3012; --good:#5CC88B; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --inset:#1E2530; --ink:#E8ECF1; --ink-2:#A2ADBB; --ink-3:#7C8795;
  --line:#2A323E; --accent:#6EA6FF; --accent-ink:#0A1322; --accent-soft:#1A2A45;
  --gold:#E6BC4C; --gold-soft:#3A3012; --good:#5CC88B; --danger:#FF8A80;
  color-scheme:dark;
}
:root{--pin:#C9402E;--heat1:#B4CEF5;--heat2:#6F9FE6;--heat2-ink:#0B1B33;--heat3:#1D5FD1;--heat3-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pin:#FF7A66;--heat1:#27447A;--heat2:#3C70BF;--heat2-ink:#FFFFFF;--heat3:#6EA6FF;--heat3-ink:#0A1322}}
:root[data-theme="dark"]{--pin:#FF7A66;--heat1:#27447A;--heat2:#3C70BF;--heat2-ink:#FFFFFF;--heat3:#6EA6FF;--heat3-ink:#0A1322}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input{font-family:inherit}
.muted{color:var(--ink-3);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:16px;flex:none}
.brand .pl{fill:var(--accent)} .brand .bar{fill:var(--ink)}
.seg{display:inline-flex;background:var(--inset);border-radius:8px;padding:3px}
.seg button{font:600 15px var(--body);min-width:46px;height:34px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}

.h2{font:600 14px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:30px 0 10px}
.kicker{font:600 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.empty{color:var(--ink-2);margin:6px 0 0}

.lifts{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.lift{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:inherit;text-decoration:none}
.lift:hover{border-color:var(--accent)}
.lift-name{grid-column:1;font:600 28px/1.05 var(--display);overflow-wrap:anywhere}
.lift-meta{grid-column:1;color:var(--ink-2);font-size:15px}
.lift-meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lift-side{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.delta{font:600 14px var(--body);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.delta.up{color:var(--good)}
.sp-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-area{fill:var(--accent);fill-opacity:.12}
.sp-dot{fill:var(--accent)}

.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input{height:48px;width:100%;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:18px;font-variant-numeric:tabular-nums}
input::placeholder{color:var(--ink-3)}
.btn{font:700 20px var(--display);letter-spacing:.08em;text-transform:uppercase;height:48px;padding:0 22px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.wide{width:100%}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sug button{font:500 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.sug button:hover{border-color:var(--accent)}

.back{display:inline-block;color:var(--ink-2);text-decoration:none;font-weight:500;padding:6px 0;margin-bottom:4px}
.title{font:700 44px/1 var(--display);margin:0 0 20px;overflow-wrap:anywhere}
.best .kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbtag{background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:1px 6px;font-size:12px;letter-spacing:.08em}
.when{letter-spacing:0;text-transform:none;font-weight:500}
.best-num{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-family:var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.best-num .n{font-size:84px;font-weight:700;line-height:.95}
.best-num .u{font-size:28px;font-weight:600;color:var(--ink-2)}
.best-num .x{font-size:34px;font-weight:600;color:var(--ink-2);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.stats dt{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stats dd{margin:2px 0 0;font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.f{min-width:0}
.f-w{grid-column:1 / -1}
.f label{display:block;font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
.stepper button{height:48px;border:1px solid var(--line);border-radius:8px;background:var(--inset);color:var(--ink);font-size:24px;cursor:pointer}
.plates{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0;min-height:34px}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:17px;font:600 14px var(--body);font-variant-numeric:tabular-nums;border:1px solid rgba(128,128,128,.45)}
.best .plates{margin:12px 0 0}
.kindrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-8px 0 20px}
.seg.small button{height:30px;min-width:0;padding:0 12px;font-size:14px}
.stack-readout{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font-family:var(--display);font-variant-numeric:tabular-nums;margin-bottom:6px}
.stack-readout .n{font-size:56px;font-weight:700;line-height:.95}
.stack-readout .u{font-size:22px;font-weight:600;color:var(--ink-2)}
.stack-readout .pinlbl{font:500 14px var(--body);color:var(--ink-3);margin-left:auto}
.stack-frame{max-width:340px;margin:0 auto;padding:12px 0 14px}
.slabs{position:relative;width:calc(100% - 64px);display:flex;flex-direction:column;gap:2px;--pitch:calc(var(--ph) + 2px)}
.slabs::before,.slabs::after{content:"";position:absolute;top:-10px;bottom:-10px;width:6px;border-radius:3px;background:var(--line)}
.slabs::before{left:14px}
.slabs::after{right:14px}
.slab{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;width:100%;height:var(--ph);padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--inset);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:clamp(11px,calc(var(--ph) * .55),17px);font-variant-numeric:tabular-nums;cursor:pointer;transition:transform .12s,background-color .12s,border-color .12s}
.slab::after{content:"";position:absolute;right:-1px;top:50%;width:10px;height:6px;margin-top:-3px;background:var(--surface);border-radius:3px 0 0 3px}
.slab .wt{font-weight:500;opacity:.85}
.slab.nowt .wt{display:none}
.slab.lifted{transform:translateY(-6px);background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.slab.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pin{position:absolute;z-index:2;left:calc(100% - 28px);width:92px;height:44px;top:calc(var(--pitch) * (var(--p) - 1) + var(--ph) / 2 - 6px);transform:translateY(-50%);touch-action:none;cursor:grab;transition:top .1s}
.pin.dragging{cursor:grabbing;transition:none}
.pin-bar{position:absolute;left:0;right:20px;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;background:var(--pin)}
.pin-knob{position:absolute;right:0;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;border:6px solid var(--pin);background:var(--surface)}
.swin{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-bottom:8px}
.swin input{width:150px;height:60px;font:700 36px var(--display);font-variant-numeric:tabular-nums;text-align:center}
.swin .u{font:600 22px var(--display);color:var(--ink-2)}
.swin .pinlbl{font:500 14px var(--body);color:var(--ink-3);margin-left:auto}
#sw-reset{margin:0 0 6px}
.nudge{display:flex;gap:8px;margin-top:8px}
.nudge button{flex:1;height:44px;border:1px solid var(--line);background:var(--inset);color:var(--ink);border-radius:8px;font:600 16px var(--body);cursor:pointer}
.setup{margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.setup summary{cursor:pointer;color:var(--ink-2);font-weight:500}
.setup .fields{margin-top:12px}
.msg{margin:12px 0 0;font-weight:600}
.msg.ok{color:var(--good)}
.msg.err{color:var(--danger)}
.msg.pb{background:var(--gold-soft);color:var(--gold);padding:8px 12px;border-radius:8px}

.chartbox{padding:12px 12px 8px}
.chartbox svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.axis{fill:var(--ink-3);font:11px var(--body);font-variant-numeric:tabular-nums}
.axis.val{fill:var(--ink);font-weight:600}
.ch-area{fill:var(--accent);fill-opacity:.1}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.dot.last{fill:var(--accent)}
.dot.pb{fill:var(--gold);stroke:var(--gold)}

.day{padding:12px 0;border-top:1px solid var(--line)}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:14px;margin-bottom:4px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:4px 10px;padding:2px 0}
.sw{font:600 24px var(--display);font-variant-numeric:tabular-nums}
.sw small{font:500 15px var(--body);color:var(--ink-3)}
.ghost{font:500 14px var(--body);color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:36px;cursor:pointer}
.ghost.armed{color:var(--danger);border-color:var(--danger)}
.dangerzone{margin-top:28px;display:flex;justify-content:center}
.fig{display:block;width:100%;height:auto;background:var(--inset);border-radius:8px}
.animfig{max-width:260px;margin:0 auto}
.demo-fig{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.animbtn{font:600 13px var(--body);color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.animbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.fig .fl{stroke:var(--line);stroke-width:1.5}
.fig .num{fill:var(--ink-3);font:600 9px var(--body)}
.fig .limb{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .far{stroke:var(--ink-3);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .head{fill:var(--ink)}
.fig .eq{stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;fill:none}
.fig .eqf{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.2}
.fig .pad{stroke:var(--line);stroke-width:7;stroke-linecap:round}
.fig .pf{stroke:var(--ink-3);stroke-width:4;stroke-linecap:round}
.fig .cab{stroke:var(--ink-3);stroke-width:1.2}
.fig .barc{fill:var(--accent);stroke:var(--surface);stroke-width:1.2}
.fig .barn{fill:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:10px 0 6px}
.chips button{flex:none;font:500 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.libgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.libgrid .empty{grid-column:1 / -1}
.libcard{display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;color:inherit;font-family:inherit;cursor:pointer;min-width:0}
.libcard:hover{border-color:var(--accent)}
.lc-en{font:600 21px/1.1 var(--display);margin-top:6px;overflow-wrap:anywhere}
.lc-es{color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.lc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.tag.on{color:var(--good);border-color:var(--good)}
.demo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 20px}
.lc-parts{display:block;margin-top:5px;font-size:12.5px;line-height:1.3;color:var(--ink-3);overflow-wrap:anywhere}
.lc-parts.es{margin-top:1px}
.demo-parts{display:flex;flex-direction:column;margin-top:10px}
.demo-parts .lc-parts{font-size:14px;color:var(--ink-2)}
.demo-parts .lc-parts.es{color:var(--ink-3)}
.demo-names b{display:block;font:700 26px/1 var(--display);overflow-wrap:anywhere}
.demo-names span{color:var(--ink-2)}
.demo p{margin:8px 0 0;font-size:15px}
@media (max-width:480px){.demo{grid-template-columns:minmax(0,1fr)}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--inset);border-radius:10px;padding:4px;margin:-6px 0 20px}
.tabs a{display:block;text-align:center;padding:10px 8px;border-radius:7px;color:var(--ink-2);text-decoration:none;font:600 16px var(--body)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.title.sm{font-size:34px;margin:0 0 6px}
.sumline{margin:0 0 16px;color:var(--ink-2);font-size:15px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
.more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:46px;margin:18px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.more:hover{border-color:var(--accent)}
.overview{margin-top:14px}
.acts{display:inline-flex;gap:4px}
.set .sw{font-size:22px}
.setnote{grid-column:1 / -1;margin:0 0 4px;padding:6px 10px;border-radius:6px;background:var(--inset);color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.noteform{grid-column:1 / -1;display:flex;gap:6px;margin:2px 0 6px}
.noteform input{height:40px;font-size:16px;flex:1}
.noteform .btn{height:40px;padding:0 14px;font-size:16px}
.msglink{margin-left:8px;color:inherit;font-weight:600;text-decoration:underline}
.lv.zin{animation:zin .28s ease-out}
.lv.zout{animation:zout .28s ease-out}
@keyframes zin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes zout{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lv.zin,.lv.zout{animation:none}}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.lnav .crumb{color:var(--accent);text-decoration:none;font-weight:600;font-size:17px;padding:6px 0}
.lnav .step{display:inline-flex;gap:6px;margin-left:auto}
.lnav .step a{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:22px;line-height:1}
.ltitle{font:700 42px/1 var(--display);margin:0 0 4px;overflow-wrap:anywhere}
.lnav .ltitle{margin:0}
.lsub{margin:0 0 16px;color:var(--ink-2)}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 20px}
.sumrow div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.sumrow dt{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sumrow dd{margin:2px 0 0;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.mini{display:block;color:inherit;text-decoration:none;padding:6px 4px;border-radius:8px;min-width:0}
.mini:hover{background:var(--surface)}
.mini h3{margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;font:600 15px var(--body)}
.mini h3 span{font:600 12px var(--body);color:var(--ink-3);font-variant-numeric:tabular-nums}
.mini.cur h3{color:var(--accent)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mg i{display:grid;place-items:center;aspect-ratio:1;font:500 8.5px var(--body);font-style:normal;color:var(--ink-3);border-radius:50%;font-variant-numeric:tabular-nums}
.l1{background:var(--heat1);color:var(--ink)!important}
.l2{background:var(--heat2);color:var(--heat2-ink)!important}
.l3{background:var(--heat3);color:var(--heat3-ink)!important}
.mg i.td{outline:1px solid var(--accent)}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function toU(kg){return kg*F[unit];}
function toKg(v){return v/F[unit];}
function fmtN(n){return String(Math.round(n*10)/10);}
function fmtW(kg){return fmtN(toU(kg));}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function parseD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function dayDiff(s){return Math.round((parseD(todayStr())-parseD(s))/864e5);}
function fmtDate(s){var d=parseD(s),o={day:'numeric',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';try{return d.toLocaleDateString(loc(),o);}catch(e){return s;}}
function ago(s){var n=dayDiff(s);if(n<=0)return tr('Today');if(n===1)return tr('Yesterday');if(n<14)return tr('{n} days ago',{n:n});if(n<60)return tr('{n} weeks ago',{n:Math.floor(n/7)});return fmtDate(s);}
function route(){var h=location.hash.slice(1);return h.indexOf('ex-')===0?h.slice(3):'';}

function norm(id,v){
  if(!v||typeof v.name!=='string')return null;
  var entries=(Array.isArray(v.entries)?v.entries:[]).filter(function(s){return s&&typeof s.d==='string'&&typeof s.i==='string'&&isFinite(s.w)&&isFinite(s.r);}).map(function(s){var o={i:s.i,d:s.d,w:+s.w,r:+s.r};if(isFinite(s.p)&&s.p>0)o.p=Math.round(+s.p);if(typeof s.n==='string'&&s.n)o.n=s.n.slice(0,200);if(isFinite(s.t)&&s.t>0)o.t=+s.t;if(isFinite(s.u)&&s.u>0)o.u=+s.u;return o;});
  var kind=v.kind==='stack'?'stack':'free';
  return {id:id,name:v.name,created:+v.created||0,kind:kind,stack:kind==='stack'?normStack(v.stack):null,lib:(typeof v.lib==='string'&&LIBMAP[v.lib])?v.lib:'',entries:entries};
}
function defStack(){return {n:15,step:toKg(unit==='kg'?5:10)};}
function normStack(s){
  var d=defStack();if(!s)return d;
  var n=Math.round(+s.n),st=+s.step;
  return {n:(n>=2&&n<=40)?n:d.n,step:(st>0&&st<500)?st:d.step};
}
function fmt2(n){return String(Math.round(n*100)/100);}
function loadLocal(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return;
    var o=JSON.parse(raw);
    if(o.unit==='lb'||o.unit==='kg')unit=o.unit;
    if(o.lang==='es'||o.lang==='en')lang=o.lang;
    if(isFinite(o.rest)&&o.rest>=0&&o.rest<=900)restLen=Math.round(o.rest);
    if(typeof o.theme==='string'&&themeOk(o.theme))theme=o.theme;
    if(o.look==='light'||o.look==='dark'||o.look==='auto')look=o.look;
    if(isFinite(o.sm)&&o.sm>0)sm=+o.sm;
    if(o.gone&&typeof o.gone==='object')mergeGone(o.gone);
    if(o.tpl)tpl=normTpl(o.tpl);
    if(o.ex&&typeof o.ex==='object'){for(var id in o.ex){var e=norm(id,o.ex[id]);if(e)ex[id]=e;}}
  }catch(e){}
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({unit:unit,lang:lang,rest:restLen,theme:theme,look:look,sm:sm,gone:gone,tpl:tpl,ex:ex}));}catch(e){}}

/* ---------- lift maths ---------- */
function sorted(e){return e.entries.map(function(s,i){return {s:s,i:i};}).sort(function(a,b){return a.s.d<b.s.d?-1:a.s.d>b.s.d?1:a.i-b.i;}).map(function(x){return x.s;});}
function better(a,b){return (b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a;}
function bestOf(e){var s=sorted(e);return s.length?s.reduce(better):null;}
function lastSet(e){var s=sorted(e);return s.length?s[s.length-1]:null;}
function sessionsOf(e){
  var m={},order=[];
  sorted(e).forEach(function(s){if(!m[s.d]){m[s.d]=[];order.push(s.d);}m[s.d].push(s);});
  return order.map(function(d){return {d:d,sets:m[d],top:m[d].reduce(better)};});
}
function e1rm(s){return s.r===1?s.w:s.w*(1+s.r/30);}
function lastDate(e){var l=lastSet(e);return l?l.d:'';}

function nice(min,max){
  if(max-min<1e-9){var p=Math.max(1,Math.abs(max)*0.05);min-=p;max+=p;}
  var raw=(max-min)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/mag;
  var step=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*mag;
  var lo=Math.max(0,Math.floor(min/step+1e-9)*step),hi=Math.ceil(max/step-1e-9)*step,t=[];
  for(var v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1000)/1000);
  return [lo,hi,t];
}

function platesHTML(total,barOv){
  var bar=barOv||(unit==='kg'?20:45);
  if(!(total>0))return '<span class="muted">'+tr('Enter a weight to see the plates for each side of a {b} {u} bar.',{b:bar,u:unit})+'</span>';
  if(total<bar-1e-9)return '<span class="muted">'+tr('Lighter than the {b} {u} bar.',{b:bar,u:unit})+'</span>';
  var set=unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5],rem=(total-bar)/2,out=[],i,p;
  for(i=0;i<set.length;i++){p=set[i];while(rem>=p-1e-9){out.push(p);rem-=p;}}
  var left=Math.round(rem*2*100)/100,h='<span class="kicker">'+tr('Per side')+'</span>';
  if(!out.length)h+='<span class="muted">'+tr('Empty bar')+'</span>';
  out.forEach(function(q){var c=PC[unit][q];h+='<span class="plate" style="background:'+c[0]+';color:'+c[1]+'">'+q+'</span>';});
  if(left>0.01)h+='<span class="muted">'+tr('+{n} {u} left over',{n:left,u:unit})+'</span>';
  return h;
}

/* ---------- drawing ---------- */
function spark(vals){
  var W=96,H=34,p=3,n=vals.length,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  function X(i){return p+i*(W-2*p)/(n-1);}
  function Y(v){return mx===mn?H/2:H-p-(v-mn)/(mx-mn)*(H-2*p);}
  var pts=vals.map(function(v,i){return [X(i),Y(v)];});
  var line=pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[n-1][0].toFixed(1)+' '+(H-p)+' L'+pts[0][0].toFixed(1)+' '+(H-p)+' Z';
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path class="sp-area" d="'+area+'"/><path class="sp-line" d="'+line+'"/><circle class="sp-dot" cx="'+pts[n-1][0].toFixed(1)+'" cy="'+pts[n-1][1].toFixed(1)+'" r="3.2"/></svg>';
}
function chart(sess,best){
  var W=360,H=200,L=40,R=14,T=22,B=26,n=sess.length;
  var vals=sess.map(function(s){return toU(s.top.w);});
  var sc=nice(Math.min.apply(null,vals),Math.max.apply(null,vals)),lo=sc[0],hi=sc[1];
  var t0=parseD(sess[0].d).getTime(),t1=parseD(sess[n-1].d).getTime();
  function X(i){return L+((parseD(sess[i].d).getTime()-t0)/(t1-t0))*(W-L-R);}
  function Y(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B);}
  var g='';
  sc[2].forEach(function(v){var y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="axis" x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmtN(v)+'</text>';});
  var pts=vals.map(function(v,i){return [X(i),Y(v)];});
  var line=pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[n-1][0].toFixed(1)+' '+Y(lo).toFixed(1)+' L'+pts[0][0].toFixed(1)+' '+Y(lo).toFixed(1)+' Z';
  var dots='';
  pts.forEach(function(q,i){
    var cls='dot'+(i===n-1?' last':'')+(sess[i].top.i===best.i?' pb':'');
    dots+='<circle class="'+cls+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(i===n-1?5:3.5)+'"/>';
  });
  var lx=pts[n-1][0],ly=Math.max(12,pts[n-1][1]-11);
  var label='<text class="axis val" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="end">'+fmtN(vals[n-1])+' '+unit+'</text>';
  var xl='<text class="axis" x="'+L+'" y="'+(H-8)+'">'+esc(fmtDate(sess[0].d))+'</text><text class="axis" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(fmtDate(sess[n-1].d))+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(tr('Top set per session in {u}, {a} to {b}',{u:unit,a:fmtDate(sess[0].d),b:fmtDate(sess[n-1].d)}))+'">'+g+'<path class="ch-area" d="'+area+'"/><path class="ch-line" d="'+line+'"/>'+dots+label+xl+'</svg>';
}

/* advanced exercises: reuse a drawn pose set, change name, grip, cue and muscles */
function alias(src,id,en,es,g,hold,cue,cuees,parts){
  var s=LIBMAP[src];if(!s)return;
  addLib(id,en,es,g,s.kind,hold||s.hold,s.anchor,s.gear,s.poses,cue,cuees);
  PT(id,parts);if(s.front)LIBMAP[id].front=true;
}

function holdSVG(it,x,y){
  if(it.hold==='bar')return '<circle class="barc" cx="'+x+'" cy="'+y+'" r="6.5"/><circle class="barn" cx="'+x+'" cy="'+y+'" r="2"/>';
  if(it.hold==='db')return '<circle class="barc" cx="'+x+'" cy="'+y+'" r="4.5"/>';
  if(it.hold==='dbh')return '<rect class="barc" x="'+(x-6)+'" y="'+(y-2.5)+'" width="12" height="5" rx="2"/>';
  if(it.hold==='handle')return '<circle class="barc" cx="'+x+'" cy="'+y+'" r="3.5"/>';
  return '';
}
function fx(x,m){return m?100-x:x;}
/* front view: pose lists the right arm and leg, the left side is mirrored */
function drawFront(it,p,gi){
  var g=Array.isArray(it.gear)?(it.gear[gi]||it.gear[0]):it.gear,s=g||'',m;
  s+='<polyline class="limb" points="'+(100-p[0])+','+p[1]+' '+p[0]+','+p[1]+'"/><line class="limb" x1="50" y1="'+p[1]+'" x2="50" y2="'+p[7]+'"/><polyline class="limb" points="'+(100-p[6])+','+p[7]+' '+p[6]+','+p[7]+'"/>';
  for(m=0;m<2;m++){
    s+='<polyline class="limb" points="'+fx(p[10],m)+','+p[11]+' '+fx(p[8],m)+','+p[9]+' '+fx(p[6],m)+','+p[7]+'"/>';
    s+='<polyline class="limb" points="'+fx(p[0],m)+','+p[1]+' '+fx(p[2],m)+','+p[3]+' '+fx(p[4],m)+','+p[5]+'"/>';
  }
  s+='<circle class="head" cx="50" cy="'+(p[1]-9)+'" r="5.5"/>';
  for(m=0;m<2;m++)s+=holdSVG(it,fx(p[4],m),p[5]);
  return s;
}
function drawPose(it,p,gi){
  if(it.front)return drawFront(it,p,gi);
  var g=Array.isArray(it.gear)?(it.gear[gi]||it.gear[0]):it.gear,s=g||'';
  if(p.length>12)s+='<polyline class="far" points="'+p[6]+','+p[7]+' '+p[12]+','+p[13]+' '+p[14]+','+p[15]+'"/>';
  else if(p[11]>=64&&Math.abs(p[10]-p[8])<40)s+='<polyline class="far" points="'+(p[6]-2)+','+p[7]+' '+(p[8]+4)+','+(p[9]-1)+' '+(p[10]+6)+','+p[11]+'"/>';
  var dx=p[0]-p[6],dy=p[1]-p[7],l=Math.sqrt(dx*dx+dy*dy)||1,hx=(p[0]+dx/l*8).toFixed(1),hy=(p[1]+dy/l*8).toFixed(1);
  if(it.anchor)s+='<line class="cab" x1="'+p[4]+'" y1="'+p[5]+'" x2="'+it.anchor[0]+'" y2="'+it.anchor[1]+'"/><circle class="eqf" cx="'+it.anchor[0]+'" cy="'+it.anchor[1]+'" r="3"/>';
  s+='<polyline class="limb" points="'+p[10]+','+p[11]+' '+p[8]+','+p[9]+' '+p[6]+','+p[7]+' '+p[0]+','+p[1]+'"/>';
  s+='<polyline class="limb" points="'+p[0]+','+p[1]+' '+p[2]+','+p[3]+' '+p[4]+','+p[5]+'"/>';
  s+='<circle class="head" cx="'+hx+'" cy="'+hy+'" r="5.5"/>';
  if(it.hold==='bar')s+='<circle class="barc" cx="'+p[4]+'" cy="'+p[5]+'" r="6.5"/><circle class="barn" cx="'+p[4]+'" cy="'+p[5]+'" r="2"/>';
  else if(it.hold==='db')s+='<circle class="barc" cx="'+p[4]+'" cy="'+p[5]+'" r="4.5"/>';

  else if(it.hold==='handle')s+='<circle class="barc" cx="'+p[4]+'" cy="'+p[5]+'" r="3.5"/>';
  return s;
}
/* two-bone limb solver: keeps bone lengths steady while the body moves between positions */
function limbSign(a,m,b){return ((b[0]-a[0])*(m[1]-a[1])-(b[1]-a[1])*(m[0]-a[0]))>=0?1:-1;}
function limbSolve(a,b,u,l,sg){
  var dx=b[0]-a[0],dy=b[1]-a[1],d=Math.sqrt(dx*dx+dy*dy)||0.001,mx=u+l-0.01,mn=Math.abs(u-l)+0.01;
  var dc=Math.min(Math.max(d,mn),mx),al=(u*u-l*l+dc*dc)/(2*dc),h=Math.sqrt(Math.max(u*u-al*al,0));
  return [a[0]+dx/d*al-dy/d*h*sg,a[1]+dy/d*al+dx/d*h*sg];
}
function limbInfo(p0,p1,ai,mi,bi){
  function pt(p,i){return [p[i],p[i+1]];}
  function len(a,b){return Math.sqrt((a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1]));}
  var A0=pt(p0,ai),M0=pt(p0,mi),B0=pt(p0,bi),A1=pt(p1,ai),M1=pt(p1,mi),B1=pt(p1,bi);
  var c0=Math.abs((B0[0]-A0[0])*(M0[1]-A0[1])-(B0[1]-A0[1])*(M0[0]-A0[0])),c1=Math.abs((B1[0]-A1[0])*(M1[1]-A1[1])-(B1[1]-A1[1])*(M1[0]-A1[0]));
  return {u0:len(A0,M0),l0:len(M0,B0),u1:len(A1,M1),l1:len(M1,B1),sg:c0>=c1?limbSign(A0,M0,B0):limbSign(A1,M1,B1)};
}
function blendPose(a,b,k,info){
  var o=a.map(function(v,i){return v+(b[i]-v)*k;});
  info.forEach(function(f){
    var A=[o[f.a],o[f.a+1]],B=[o[f.b],o[f.b+1]],u=f.u0+(f.u1-f.u0)*k,l=f.l0+(f.l1-f.l0)*k,m=limbSolve(A,B,u,l,f.sg);
    o[f.m]=m[0];o[f.m+1]=m[1];
  });
  return o;
}
function padFar(p,q){return (q.length>12&&p.length<=12)?p.concat([p[8]-2,p[9],p[10]-2,p[11]]):p;}
function animPoses(it){
  if(it.__ap)return it.__ap;
  var a=it.poses[0],b=it.poses[1];it.__ap=[padFar(a,b),padFar(b,a)];return it.__ap;
}
function poseInfo(it){
  if(it.__pi)return it.__pi;
  var ap=animPoses(it),a=ap[0],b=ap[1],r=[];
  [[0,2,4],[6,8,10]].concat(a.length>12&&b.length>12?[[6,12,14]]:[]).forEach(function(t){
    var f=limbInfo(a,b,t[0],t[1],t[2]);f.a=t[0];f.m=t[1];f.b=t[2];r.push(f);
  });
  it.__pi=r;return r;
}
function figSVG(it){

    s+='<g transform="translate('+(off+i*108)+',0)"><line class="fl" x1="2" x2="98" y1="70" y2="70"/>'+(n>1?'<text class="num" x="6" y="-6">'+(i+1)+'</text>':'')+drawPose(it,p,i)+'</g>';
  });
  return '<svg class="fig" viewBox="0 -16 208 96" role="img" aria-label="'+esc(it.en)+' – '+esc(it.es)+(n>1?', '+esc(tr('start and end positions')):'')+'">'+s+'</svg>';

/* animated demo: the figure glides between the start and end positions */
function reduceMotion(){try{return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){return false;}}
var animRAF=0,animOn=!reduceMotion(),animK=0;
function lerpPose(a,b,k){return a.map(function(v,i){return v+(b[i]-v)*k;});}
function animFigHTML(it){
  if(it.poses.length<2)return figSVG(it);

    '<button type="button" class="animbtn" id="animBtn" data-action="animtoggle" aria-pressed="'+(!animOn)+'">'+tr(animOn?'Pause animation':'Play animation')+'</button>';
}
function drawAnim(it,k){
  var g=document.getElementById('animg');if(!g)return;
  var ap=animPoses(it);g.innerHTML=drawPose(it,blendPose(ap[0],ap[1],k,poseInfo(it)),k>0.5?1:0);
}
function startAnim(){
  cancelAnimationFrame(animRAF);
  var g=document.getElementById('animg');if(!g||!overviewOpen||!animOn)return;
  var e=ex[route()],it=e&&libFor(e);if(!it||it.poses.length<2)return;
  var T=3400,t0=performance.now();
  function step(now){
    var cur=document.getElementById('animg');
    if(cur!==g||!overviewOpen||!animOn)return;
    var u=((now-t0)%T)/T,k;
    if(u<0.08)k=0;else if(u<0.42)k=(u-0.08)/0.34;else if(u<0.52)k=1;else if(u<0.94)k=1-(u-0.52)/0.42;else k=0;
    k=k*k*(3-2*k);animK=k;drawAnim(it,k);
    animRAF=requestAnimationFrame(step);
  }
  animRAF=requestAnimationFrame(step);
}

function dim(y,m){return new Date(y,m,0).getDate();}

function logRoute(){

  var now=new Date();
  if(h==='log')return {y:now.getFullYear(),m:now.getMonth()+1,d:0};
  var p=h.split('-').slice(1).map(function(x){return parseInt(x,10);});
  var y=(p[0]>=1970&&p[0]<=2200)?p[0]:now.getFullYear();

function monthStats(byD,y,m){

    if(d.indexOf(pre)===0){c++;sc+=byD[d].length;days.push(d);byD[d].forEach(function(x){if(!seen[x.e.id]){seen[x.e.id]=1;lifts++;}});}

function dayView(lr,byD){

  h+='<h1 class="ltitle">'+esc(wdName(y,m,d,'long'))+'</h1>';

  h+='<p class="lsub">'+esc(full)+(ts.length?' · '+esc(tr('Started {t}',{t:fmtTime(ts[0])}))+(ts.length>1&&ts[ts.length-1]-ts[0]>60000?esc(', '+tr('last set {t}',{t:fmtTime(ts[ts.length-1])})):''):'')+'</p>';
  if(!items.length){
    return h+'<p class="empty">'+tr('No sets logged on this day.')+'</p><p><a class="msglink" href="#">'+tr('Go to Workouts')+'</a></p>';

    var g=groups[x.e.id];g.sets.push(x.s);if(x.s.t&&x.s.t<g.t)g.t=x.s.t;vol+=x.s.w*x.s.r;

  h+=sumRow([[tr('Lifts'),order.length],[tr('Sets'),items.length],[tr('Volume ({u})',{u:unit}),Math.round(toU(vol)).toLocaleString(loc())]]);

      g.sets.map(function(t){return setRowHTML(g.e,t,b?b.i:'');}).join('')+'</section>';
  }).join('');

function applyPin(p){

function pruneEmpty(){
  var keep=route(),inPlan={};
  tpl.forEach(function(p){p.items.forEach(function(i){inPlan[i]=1;});});
  Object.keys(ex).filter(function(k){return !ex[k].entries.length&&k!==keep&&!inPlan[k];}).forEach(function(k){delete ex[k];persist(k);});
}
function planById(id){for(var i=0;i<tpl.length;i++)if(tpl[i].id===id)return tpl[i];return null;}
function pname(p){return p.name||tr('New routine');}
function curPlan(){var pg=pageRoute();return pg&&pg.k==='plan'?planById(pg.id):null;}
function doneToday(id){var e=ex[id],t=todayStr();return !!e&&e.entries.some(function(s){return s.d===t;});}
function dayLifts(d){
  var o=[];
  Object.keys(ex).forEach(function(k){var t=Infinity,has=false;ex[k].entries.forEach(function(s){if(s.d===d){has=true;if(s.t&&s.t<t)t=s.t;}});if(has)o.push({id:k,t:t});});
  o.sort(function(a,b){return a.t!==b.t?(a.t<b.t?-1:1):0;});
  return o.map(function(x){return x.id;});
}
function visItems(p){var o=[];p.items.forEach(function(id,ix){if(ex[id])o.push({id:id,ix:ix});});return o;}
function ensureLift(libId){
  var it=LIBMAP[libId];if(!it)return null;
  var have=Object.keys(ex).filter(function(k){var l=libFor(ex[k]);return l&&l.id===libId;})[0];
  if(have)return have;
  var id='x'+uid();
  ex[id]={id:id,name:it.en,created:Date.now(),kind:it.kind,stack:it.kind==='stack'?defStack():null,lib:it.id,entries:[]};
  persist(id);return id;
}
function newPlanFrom(d){

function planResultsHTML(p){
  var q=strip(planQ).trim(),have={},out=[];
  p.items.forEach(function(i){have[i]=1;});
  if(!q){
    Object.keys(ex).map(function(k){return ex[k];}).filter(function(e){return !have[e.id];}).sort(function(a,b){var x=lastDate(a),y=lastDate(b);return x<y?1:x>y?-1:0;}).slice(0,8).forEach(function(e){out.push({ex:e.id,label:exName(e)});});
  }else{

function wfail(e){

  }else if(c==='quota_exceeded'){note(tr('Your lift storage is full. Delete a lift you no longer need.'));}
  else{note(tr('Couldn’t save just now. Your change is still on screen, so try it again.'));}

function enqueue(key,fn){
  queues[key]=(queues[key]||Promise.resolve()).then(function(){
    return fn().catch(function(e){
      if(e&&e.code==='unavailable')return new Promise(function(r){setTimeout(r,600+Math.random()*600);}).then(fn);
      throw e;
    });
  }).catch(wfail);
}
function persist(id){
  saveLocal();markDirty();

  enqueue(id,function(){
    var e=ex[id];
    if(!e)return col.doc(id).delete();
    var body={name:e.name,created:e.created,kind:e.kind||'free',entries:e.entries};
    if(e.lib)body.lib=e.lib;
    if(e.kind==='stack'&&e.stack)body.stack=e.stack;
    return col.doc(id).set(body);

function addLift(raw,kind,lib){

  var dup=Object.keys(ex).filter(function(k){return ex[k].name.toLowerCase()===nm.toLowerCase();})[0];
  if(dup){newName='';addMsg='';location.hash='ex-'+dup;return;}
  var id='x'+uid();

function logSet(){

  if(!(rv>=1&&rv<=100)){msg={k:'err',t:tr('Enter reps between 1 and 100.')};return render();}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>todayStr()){msg={k:'err',t:tr('Pick today or an earlier date.')};return render();}
  var s={i:uid(),d:d,w:toKg(wv),r:rv},prev=bestOf(e);

  applyPin(Math.floor((ev.clientY-slabs.getBoundingClientRect().top)/(f.offsetHeight+2))+1);
});
function endDrag(){dragging=false;var pin=document.getElementById('pin');if(pin)pin.classList.remove('dragging');}

document.addEventListener('keydown',function(ev){
  if(ev.target.id!=='pin')return;

  var t=ev.target;if(t.id!=='stackN'&&t.id!=='stackStep')return;

  if(n>=2&&n<=40)st.n=n;

});

(async function boot(){
  var db=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      var got=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=got[0];user=got[1];
    }
  }catch(e){}
  var uidv=null;
  try{uidv=user?await user.id():null;}catch(e){}
  if(!db||!uidv){mode='local';status='local';sLoad();if(syncCfg()&&SY.sess)syncSoon(300);render();return;}
  mode='db';status='connecting';
  col=db.collection('data/users/'+uidv);
  var seed=Object.assign({},ex),seedUnit=unit,migrated=false;
  var timer=setTimeout(function(){if(status==='connecting'){status='slow';render();}},10000);
  col.onSnapshot(function(snap){
    var next={},n=0,u=null,lg=null,rs=null,tp=null,th=null,lk=null;
    snap.docs.forEach(function(d){
      var v=d.data();
      if(d.id==='settings'){if(v){if(v.unit==='kg'||v.unit==='lb')u=v.unit;if(v.lang==='es'||v.lang==='en')lg=v.lang;if(typeof v.theme==='string'&&themeOk(v.theme))th=v.theme;if(v.look==='light'||v.look==='dark'||v.look==='auto')lk=v.look;if(v.gone)mergeGone(v.gone);if(isFinite(v.rest)&&v.rest>=0&&v.rest<=900)rs=Math.round(v.rest);if(Array.isArray(v.tpl))tp=normTpl(v.tpl);}}
      else if(v){var e=norm(d.id,v);if(e){next[d.id]=e;n++;}}
    });
    var definitive=!snap.metadata.fromCache;
    if(definitive){status='synced';clearTimeout(timer);}
    if(n===0){
      if(!definitive){render();return;}
      if(!migrated&&Object.keys(seed).length){
        migrated=true;
        Object.keys(seed).forEach(function(id){ex[id]=seed[id];persist(id);});
        enqueue('settings',function(){return col.doc('settings').set(settingsBody());});
        render();return;
      }
    }
    if(definitive)migrated=true;
    ex=next;if(definitive)pruneEmpty();if(u)unit=u;if(lg)lang=lg;if(rs!=null)restLen=rs;if(tp)tpl=tp;if(th)theme=th;if(lk)look=lk;applyTheme();
    saveLocal();render();
  },function(err){
    clearTimeout(timer);
    mode='local';status='local';render();
  });
})();
})();
